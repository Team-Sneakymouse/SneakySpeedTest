name: Docker Image CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify
        run: |
          npm ci
          npm test
      - name: Check deployment configuration
        id: deployment
        env:
          IDENTITY_ID: ${{ secrets.INFISICAL_IDENTITY_ID }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
        run: |
          if [ -n "$IDENTITY_ID" ] && [ -n "$INFISICAL_DOMAIN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tests passed. Configure INFISICAL_IDENTITY_ID and INFISICAL_DOMAIN to enable image publishing and Watchtower."
          fi
      - name: Fetch registry credentials from Infisical
        if: steps.deployment.outputs.enabled == 'true'
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: lords-of-minecraft
          env-slug: prod
          secret-path: /Registry
      - name: Log in to registry
        if: steps.deployment.outputs.enabled == 'true'
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" \
            --username "$REGISTRY_USER" \
            --password-stdin
      - uses: docker/setup-buildx-action@v3
        if: steps.deployment.outputs.enabled == 'true'
      - name: Build and push
        if: steps.deployment.outputs.enabled == 'true'
        run: |
          docker buildx build \
            --tag "$REGISTRY_HOST/sneakyspeedtest:latest" \
            --push \
            .
      - name: Fetch Watchtower secrets from Infisical
        if: steps.deployment.outputs.enabled == 'true'
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ secrets.INFISICAL_IDENTITY_ID }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          project-slug: lords-of-minecraft
          env-slug: prod
          secret-path: /Watchtower
      - name: Trigger Watchtower
        if: steps.deployment.outputs.enabled == 'true'
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $WATCHTOWER_TOKEN" \
            "$WATCHTOWER_URL"
