name: Docker Image CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, alphaarcadeus]
    outputs:
      deploy-enabled: ${{ steps.deployment.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify
        run: |
          npm ci
          npm test
      - name: Check deployment configuration
        id: deployment
        env:
          IDENTITY_ID: ${{ secrets.INFISICAL_IDENTITY_ID }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
        run: |
          if [ -n "$IDENTITY_ID" ] && [ -n "$INFISICAL_DOMAIN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tests passed. Configure INFISICAL_IDENTITY_ID and INFISICAL_DOMAIN to enable image publishing and Watchtower."
          fi

  build-and-deploy:
    needs: verify
    if: needs.verify.outputs.deploy-enabled == 'true'
    uses: Team-Sneakymouse/ci/.github/workflows/docker-deploy.yml@main
    with:
      image-name: sneakyspeedtest
    secrets:
      INFISICAL_IDENTITY_ID: ${{ secrets.INFISICAL_IDENTITY_ID }}
      INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
